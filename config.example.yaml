provider: openai-compatible
base_url: https://api.openai.com/v1
api_key: YOUR_API_KEY
model: gpt-4.1-mini
# Select one control loop. External runtimes speak the same versioned protocol.
# agent_runtime:
#   driver: pi-agent
#   command: node
#   args:
#     - /absolute/path/to/integrations/pi-agent/dist/main.js
server:
  host: 127.0.0.1
  port: 18888
  # Maximum quiet period between provider SSE chunks. Raise for slow
  # OpenAI-compatible providers; 0 uses the 120-second default.
  stream_stall_timeout_seconds: 120
memory:
  context_window_tokens: 32000
